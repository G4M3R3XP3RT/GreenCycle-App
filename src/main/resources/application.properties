spring.application.name=greencycle

# Configuration Base de données H2
spring.datasource.url=jdbc:h2:mem:greencycle_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console H2 (accessible via /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret (A changer en prod)
jwt.secret=94a08da1fecbb6e8b46990538c7b50b2a65d3d4b680d3d3a0c69d80c3b0a7018
